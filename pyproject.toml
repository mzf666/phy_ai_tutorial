[project]
name = "phy-ai-tutorial"
version = "0.1.0"
description = "Concise PyTorch re-implementations of key techniques in physical-agent foundation models"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["pi", "gear"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.uv]
package = false
